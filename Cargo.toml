[package]
name = "strain-fighter"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
idlerite = { git = "ssh://git@github.com/youhide/IdleRite.git", rev = "156d96e4e24c91c253a107de5364ab433051aad7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
